    const DAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];

    // ---------- 날짜 도우미 (현지 시간 기준, calendar.html과 같은 방식) ----------
    const pad = (n) => String(n).padStart(2, "0");

    function toDateStr(d) {
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    // "YYYY-MM-DD" → 현지 시간 Date
    function parseDate(str) {
      const [y, m, d] = str.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function addDays(d, n) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
    }

    function isDateStr(str) {
      return typeof str === "string" && /^\d{4}-\d{2}-\d{2}$/.test(str);
    }

    function longLabel(str) {
      const d = parseDate(str);
      return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${DAY_NAMES[d.getDay()]})`;
    }

    // ---------- 저장/불러오기 ----------
    function loadObject(key) {
      try {
        const data = JSON.parse(localStorage.getItem(key));
        return data && typeof data === "object" && !Array.isArray(data) ? data : {};
      } catch (e) {
        return {};
      }
    }
    const loadDiary = () => loadObject("diaryEntries");
    // 하루 마무리는 읽기만 한다 (쓰는 곳은 review.html)
    const loadReviews = () => loadObject("dailyReviews");

    function writeEntry(dateStr, entry) {
      try {
        const all = loadDiary();
        if (entry) all[dateStr] = entry;
        else delete all[dateStr];
        localStorage.setItem("diaryEntries", JSON.stringify(all));
        return true;
      } catch (e) {
        return false;
      }

        { id: "c21", q: "한 달 뒤의 내가 오늘을 본다면 뭐라고 할까요?" },
        { id: "c22", q: "오늘 나에게 필요했던 것은 무엇인가요?" },
        { id: "c23", q: "내일의 나를 위해 오늘 밤 해 둘 수 있는 일은 무엇인가요?" },
        { id: "c24", q: "요즘 그만두고 싶은 습관이 있나요?" },
        { id: "c25", q: "오늘 하루에서 한 가지만 기억한다면 무엇을 기억하고 싶나요?" },
        { id: "c26", q: "요즘 나를 가장 기대하게 하는 것은 무엇인가요?" },
        { id: "c27", q: "오늘 잘 풀리지 않은 일은, 다음에 어떻게 해 보고 싶나요?" },
        { id: "c28", q: "이번 달 안에 이루고 싶은 작은 목표는 무엇인가요?" },
        { id: "c29", q: "오늘 하루에게 고맙다고 말한다면 무엇이 고마운가요?" },
      ],
    ];

    // 날짜의 일련번호. 날짜 문자열에서 바로 계산해서 시간대·서머타임의 영향을 받지 않는다
    function dayNo(dateStr) {
      const [y, m, d] = dateStr.split("-").map(Number);
      return Math.round(Date.UTC(y, m - 1, d) / 86400000);
    }

    // 그 날짜의 질문 3개. 저장하지 않고 날짜만으로 정한다 (같은 날짜는 언제 열어도 같은 질문).
    // 묶음마다 하루에 한 칸씩 차례로 넘어가므로, 같은 질문은 한 바퀴(약 한 달)가 지나야 다시 나온다.
    function pickPrompts(dateStr) {
      const n = dayNo(dateStr);
      return PROMPT_GROUPS.map((g) => g[((n % g.length) + g.length) % g.length]);
    }

    // 저장된 답변 중 형식이 맞는 것만 고른다
    function savedPrompts(entry) {
      const list = entry && Array.isArray(entry.prompts) ? entry.prompts : [];
      return list.filter((p) => p && typeof p.q === "string" && typeof p.a === "string" && p.a.trim()
        && Number.isInteger(p.slot) && p.slot >= 0 && p.slot < PROMPT_GROUPS.length);
    }

    function hasContent(entry) {
      return !!entry && !!(entry.title || entry.body || savedPrompts(entry).length);
    }

    // ---------- 화면 ----------
    const $ = (id) => document.getElementById(id);
    const titleEl = $("title");
    const bodyEl = $("body");
    const statusEl = $("status");

    // 주소에 ?date=YYYY-MM-DD 가 있으면 그 날짜를 연다
    let cur = toDateStr(new Date());
    try {
      const q = new URLSearchParams(location.search).get("date");
      if (isDateStr(q)) cur = q;
    } catch (e) {}

    let dirty = false;
    let saveTimer = null;

    function setStatus(text) { statusEl.textContent = text; }

    function saveNow() {
      clearTimeout(saveTimer);
      if (!dirty) return;
      const title = titleEl.value.trim();
      // 본문은 줄바꿈·들여쓰기를 살리고 끝의 빈 줄만 정리한다
      const body = bodyEl.value.replace(/\s+$/, "");
      const prompts = collectPrompts();
      const entry = title || body.trim() || prompts.length ? { title, body, updatedAt: Date.now() } : null;
      if (entry && prompts.length) entry.prompts = prompts;
      if (writeEntry(cur, entry)) {
        dirty = false;
        $("deleteBtn").hidden = !entry;
        const now = new Date();
        setStatus(`저장됨 ${pad(now.getHours())}:${pad(now.getMinutes())}`);
      } else {
        setStatus("저장하지 못했어요. 브라우저 저장공간을 확인해 주세요.");
      }
      renderHistory();
    }

    // 입력을 잠깐 멈추면 자동으로 저장한다
    function onInput() {
      dirty = true;
      setStatus("입력 중…");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveNow, 700);
    }

    function goTo(dateStr) {
      saveNow();
      cur = dateStr;
      render();
      window.scrollTo(0, 0);
    }

    function firstLine(text) {
      return (text || "").split("\n").map((l) => l.trim()).find((l) => l) || "";
    }

    // 지금 화면에 있는 질문 3개 ({ slot, id, q, input })
    let promptItems = [];

    // 칸마다: 저장된 답이 있으면 그때의 질문을, 없으면 그 날짜의 질문을 보여준다
    function renderPrompts(entry) {
      const saved = savedPrompts(entry);
      const picks = pickPrompts(cur);
      const box = $("prompts");
      box.replaceChildren();
      promptItems = picks.map((pick, slot) => {
        const s = saved.find((p) => p.slot === slot);
        const item = { slot, id: s ? s.id : pick.id, q: s ? s.q : pick.q };

        const wrap = document.createElement("div");
        wrap.className = "prompt";
        const q = document.createElement("button");
        q.type = "button";
        q.className = "prompt-q";
        q.textContent = item.q;
        const input = document.createElement("textarea");
        input.className = "prompt-a";
        input.id = `promptAnswer${slot}`;
        input.placeholder = "짧게 적어도 좋아요.";
        input.setAttribute("aria-label", item.q);
        input.value = s ? s.a : "";
        q.setAttribute("aria-controls", input.id);

        const setOpen = (open) => {
          wrap.classList.toggle("open", open);
          input.hidden = !open;
          q.setAttribute("aria-expanded", String(open));
        };
        setOpen(!!s);
        // 질문을 누르면 답변 칸을 펼친다. 쓴 답이 있으면 접지 않는다
        q.addEventListener("click", () => {
          if (input.hidden) { setOpen(true); input.focus(); }
          else if (!input.value.trim()) setOpen(false);
          else input.focus();
        });
        input.addEventListener("input", onInput);

        wrap.append(q, input);
        box.appendChild(wrap);
        item.input = input;
        return item;
      });
    }

    // 답을 쓴 질문만 모은다. 질문 문구도 함께 저장해서, 나중에 질문지를 바꿔도 지난 답이 그대로 남는다
    function collectPrompts() {
      return promptItems
        .map((p) => ({ slot: p.slot, id: p.id, q: p.q, a: p.input.value.replace(/\s+$/, "") }))
        .filter((p) => p.a.trim());
    }

    function renderRef() {
      const r = loadReviews()[cur];
      const has = r && (r.highlight || r.comment);
      $("refBox").hidden = !has;
      if (!has) return;
      $("refHighlight").textContent = r.highlight ? `대표 한 일: ${r.highlight}` : "";
      $("refHighlight").hidden = !r.highlight;
      $("refComment").textContent = r.comment || "";
      $("refComment").hidden = !r.comment;
    }

    function renderHistory() {
      const all = loadDiary();
      const dates = Object.keys(all).filter(isDateStr).sort().reverse().slice(0, 60);
      const list = $("history");
      list.replaceChildren();
      for (const d of dates) {
        const e = all[d] || {};
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button";
        if (d === cur) b.classList.add("current");

        const dateEl = document.createElement("div");
        dateEl.className = "h-date";
        dateEl.textContent = longLabel(d);
        const main = document.createElement("div");
        main.className = "h-main";
        // 제목도 본문도 없으면 첫 답변을 보여준다
        const answers = savedPrompts(e);
        main.textContent = e.title || firstLine(e.body) || (answers[0] && firstLine(answers[0].a)) || "(내용 없음)";
        b.append(dateEl, main);
        // 제목이 있으면 본문 첫 줄을 아래에 보여준다
        if (e.title && firstLine(e.body)) {
          const sub = document.createElement("div");
          sub.className = "h-sub";
          sub.textContent = firstLine(e.body);
          b.appendChild(sub);
        }
        b.addEventListener("click", () => goTo(d));
        li.appendChild(b);
        list.appendChild(li);
      }
      $("historyEmpty").hidden = dates.length > 0;
    }

    function render() {
      const isToday = cur === toDateStr(new Date());
      $("dateLabel").textContent = longLabel(cur);
      $("todayBadge").hidden = !isToday;
      $("jumpDate").value = cur;

      const e = loadDiary()[cur] || {};
      titleEl.value = e.title || "";
      bodyEl.value = e.body || "";
      dirty = false;
      setStatus(e.updatedAt ? "저장된 내용" : "");
      $("deleteBtn").hidden = !hasContent(e);
      $("promptsLabel").textContent = isToday ? "오늘의 질문" : "이 날의 질문";

      renderPrompts(e);
      renderRef();
      renderHistory();
    }

    titleEl.addEventListener("input", onInput);
    bodyEl.addEventListener("input", onInput);
    $("saveBtn").addEventListener("click", () => { dirty = true; saveNow(); render(); });
    $("deleteBtn").addEventListener("click", () => {
      if (!confirm(`${longLabel(cur)}의 일기를 지울까요? 지운 일기는 되돌릴 수 없어요.`)) return;
      clearTimeout(saveTimer);
      dirty = false;
      if (!writeEntry(cur, null)) setStatus("지우지 못했어요.");
      render();
    });
    $("prevDay").addEventListener("click", () => goTo(toDateStr(addDays(parseDate(cur), -1))));
    $("nextDay").addEventListener("click", () => goTo(toDateStr(addDays(parseDate(cur), 1))));
    $("goToday").addEventListener("click", () => goTo(toDateStr(new Date())));
    $("jumpDate").addEventListener("change", (e) => { if (isDateStr(e.target.value)) goTo(e.target.value); });

    // 페이지를 떠나거나 휴대폰에서 다른 앱으로 넘어갈 때 쓰던 내용을 저장한다
    window.addEventListener("pagehide", saveNow);
    document.addEventListener("visibilitychange", () => { if (document.hidden) saveNow(); });

    render();
  </script>
</body>
</html>
